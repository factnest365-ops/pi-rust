[workspace]
resolver = "2"
members = [
    "crates/pi-core",
    "crates/pi-tools",
    "crates/pi-session",
    "crates/pi-providers",
    "crates/pi-tui",
    "crates/pi-rpc",
    "crates/pi-cli",
    "crates/pi-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Bhavy <bhavy@antigravity.ai>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
tempfile = "3.10"
futures-util = "0.3"
dirs = "5.0"
tokio-util = "0.7"
regex = "1.10"

# Internal workspace crates
pi-core = { path = "crates/pi-core" }
pi-tools = { path = "crates/pi-tools" }
pi-session = { path = "crates/pi-session" }
pi-providers = { path = "crates/pi-providers" }
pi-tui = { path = "crates/pi-tui" }
pi-rpc = { path = "crates/pi-rpc" }
pi-daemon = { path = "crates/pi-daemon" }
